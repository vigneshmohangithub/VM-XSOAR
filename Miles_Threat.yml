                        'Type': 'URL',
                        'Vendor': 'Miles Threat',
                        'Score': Rating_Map[rating]
                    }
                }
            }
        else:
            entry = "Please enter URL in correct format"
        return entry

    def domain_enrich():
        domain = demisto.args().get('domain')
        domainLength = len(domain)
        rating = "Unknown"
