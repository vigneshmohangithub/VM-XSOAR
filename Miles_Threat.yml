    def ip_enrich():
        ip = demisto.args().get('ip')
        rating = "Unknown"
        octet = (int)(ip.split('.')[0])
        if octet <9:
            rating =  "Good"
        elif octet <50:
            rating = "Suspicious"
        elif octet <60:
            rating = "Bad"
        else:
            rating = random.choice(["Good","Suspicious","Bad","Unknown"])

        if auto_detect_indicator_type(ip) == "IP":
            entry = {
            'Type': entryTypes['note'],
            'Contents': {"IP":ip,"Rating":rating},
            'ContentsFormat': formats['markdown'],
            'HumanReadable':tableToMarkdown(name="Miles Threat Enrichment Results", t={"IP":ip,"Rating":rating}),
            'EntryContext': {
                    "DBotScore": {
                        'Indicator': ip,
                        'Type': 'IP',
                        'Vendor': 'Miles Threat',
                        'Score': Rating_Map[rating]
                    }
                }
            }
        else:
            entry = "Please enter IP in correct format"
        return entry

    def url_enrich():
        url = demisto.args().get('url')
        urlLength = len(url)
        rating="Unknown"
        if urlLength < 6:
            rating = "Good"
        elif urlLength > 6:
            if set('aeiou').intersection(url.lower()):
                rating = "Suspicious"
            else:
                if urlLength > 9:
                    rating = "Bad"
                else:
                    rating = "Unknown"
        if auto_detect_indicator_type(url) == "URL":
            entry = {
            'Type': entryTypes['note'],
            'Contents': {"URL":url,"Rating":rating},
            'ContentsFormat': formats['markdown'],
            'HumanReadable':tableToMarkdown(name="Miles Threat Enrichment Results", t={"URL":url,"Rating":rating}),
            'EntryContext': {
                    "DBotScore": {
