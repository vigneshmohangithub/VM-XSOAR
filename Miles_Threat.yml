    def file_enrich():
        file = demisto.args().get('file')
        fileCheck = file[0]
        rating = "Unknown"
        good = set('0123456')
        suspicious = set('78')
        malicious = set('9abcd')


        if any((c in good) for c in fileCheck):
            rating = "Good"
        elif any((c in suspicious) for c in fileCheck):
            rating = "Suspicious"
        elif any((c in malicious) for c in fileCheck):
            rating = "Malicious"
        else:
            rating = random.choice(["Good","Suspicious","Bad","Unknown"])

        if auto_detect_indicator_type(file) == "File":
