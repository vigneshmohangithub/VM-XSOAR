                        'Vendor': 'Miles Threat',
                        'Score': Rating_Map[rating]
                    }
                }
            }
        else:
            entry = "Please enter file hash in correct format"
        return entry

    def main() -> None:
        demisto.debug(f'Command being called is {demisto.command()}')
        try:
            if demisto.command() == 'test-module':
